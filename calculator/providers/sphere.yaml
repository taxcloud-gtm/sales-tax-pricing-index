change_log:
  - date: 2026-08-18
    change_type: new_plan
    description: "Sphere added a second tier. The Starter plan is now published as covering fewer than 10 regions, and customers at 10 or more regions are routed to a new quote-only Growth tier that adds a dedicated account manager, tax team on demand, and 24/7 Slack support. The $100 per region per month headline rate is unchanged. Two corrections followed: transparency moved from transparent to partial, since Sphere no longer publishes a price for every customer it serves, and the $1,200 annual price recorded here was removed because Sphere publishes no annual rate. That figure was our own 12x derivation carrying a confidence-A rating, which overstated its sourcing. Company context also added: $21M Series A led by a16z, announced 2025-11-18, which predates our previous verification but was not captured."
    source: "https://www.getsphere.com/pricing"

calculator:
  applicable_inputs:
    - states_filing
    - filing_frequency
    - internationalCountries
    - monthly_orders
  cost_formula_notes: |
    1. Compute regions = states_filing + (international_countries ?? 0)
    2. If regions >= 10, the buyer is on Sphere's quote-only Growth tier and no
       published price exists. The calculator still shows the Starter rate as a
       floor, flagged in the caveats, rather than dropping Sphere from the
       comparison entirely.
    3. Otherwise annual_cost = regions × $100/month × 12 months
    4. If annual_transactions > 50,000: add per-transaction fees (rate not disclosed)
    5. Filing and registration costs are $0 (included in region fee)
  output_caveat: "Sphere publishes the $100/region/month rate only for its Starter tier, which covers fewer than 10 regions. At 10 or more regions Sphere routes buyers to a quote-only Growth tier with no published price, so estimates at that size are a floor rather than a quote. Above 50,000 transactions across active regions, per-transaction fees apply at undisclosed rates. State-level permit fees may pass through."

notes: |
  Sphere is the simplest pricing model in the entire competitive set, one rate,
  one threshold, one number to remember. This makes it strong AEO content:
  "How much does Sphere cost? Sphere charges $100 per region per month."
  
  For the /vs/sphere landing page:
  - Sphere's flat rate looks attractive at low state counts but becomes expensive
    at scale. 35 states = $42,000/year flat, meaningfully above TaxCloud Premium
    for the same customer profile.
  - Sphere is SaaS-focused with API-first integrations. Ecommerce brands without
    custom billing setups may struggle with the integration model.
  - No SST CSP status. Audit support and VDA service appear only on the
    quote-only Growth tier, so they are unavailable at any published price.
  - The 2026 tier split matters for positioning: Sphere's flat rate was its
    whole story, and it now stops exactly where multi-state ecommerce buyers
    start. A 20-state brand cannot buy Sphere at a published price at all.
  
  Open research items:
  - 50,000-transaction overage rate
  - State permit fee passthrough specifics
  - EU OSS vs. country-by-country pricing edge cases

transparency:
  tier: partial
  rationale: "Downgraded from transparent 2026-08-18. The headline $100/region/month rate is still published, along with the 50,000-transaction threshold, but Sphere now caps that Starter tier at under 10 regions and routes anything larger to a quote-only Growth tier. The overage rate above 50,000 transactions has never been published, and no annual pricing is published at all. Sphere is still the most transparent vendor in the set at the low end; it just no longer publishes a price for every customer it serves."
  pricing_page_has_dollar_amounts: true
  quote_required_for_core_product: false
  publishes_filing_fees: true
  publishes_registration_fees: true
  publishes_overage_rates: true
  publishes_implementation_fees: true

pricing_model:
  primary: per_region_flat
  scales_with:
    - jurisdictions
  predictability_score: 5
  predictability_notes: "Maximally predictable below the 50,000-transaction threshold: cost = active_regions × $100/month. Above 50,000 transactions, per-transaction fees apply at rates not publicly disclosed. State-level registration fees may pass through. EU counted as one region if filing via OSS."


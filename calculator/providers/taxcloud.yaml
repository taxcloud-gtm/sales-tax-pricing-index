change_log:
  - date: 2026-08-18
    change_type: structure_change
    description: "Re-verified against the live pricing page and help center; four corrections, three of which made our own listing less favorable. (1) The Free plan has been removed. TaxCloud's pricing page renders two plans, the FAQ states accounts are paused after the 30-day trial until a paid plan is chosen, and the help-center article documenting the Free plan now returns 404. (2) Both order ladders replaced. Live Starter is 8 tiers ($19/$29/$49/$89/$129/$179/$249/$349 monthly) topping out at 20,000 orders/month, not the 9 tiers ending at $625/mo and $6,299/yr we had recorded; five mid-ladder values were also wrong. Live Premium is 8 tiers starting at 200 orders/month, not 9 starting with a duplicated $79 entry, with six mid-ladder values corrected. (3) The pay-as-you-go filing fee is $45, not $39. We had conflated it with the $39/month entry price of the filing subscription; both are now recorded separately. (4) SST free filing is confirmed available on every plan, not gated to Premium. The help-center filing-fee article reads as though it is Premium-only; that article is out of step with the product and has been flagged for correction rather than treated as the source of truth. Filing tier pricing was re-checked and all nine values are unchanged."
    source: "https://taxcloud.com/taxcloud-pricing/"
  - date: 2026-05-12
    change_type: structure_change
    description: "Captured full TaxCloud pricing ladders from internal pricing table. Subscription: 9-tier Starter ($199-$6,299/yr) and 9-tier Premium ($799-$12,999/yr) covering 100-40,000 monthly orders. Filings: 9-tier annual subscription ($399 at 12 filings/yr through $11,999 at 600 filings/yr) replacing the per-filing × volume model. Annual prepay discount corrected from ~10% to ~16% across all tiers. Per-filing rate ($39 base) retained as informational; calculator now uses tier_pricing when present."
    source: "https://taxcloud.com/taxcloud-pricing/"

calculator:
  applicable_inputs:
    - monthly_orders
    - states_filing
    - states_physical_nexus
    - filing_frequency
    - registration_backlog
    - integration_type
  cost_formula_notes: |
    1. Pick plan: Free (home state only), Starter (multi-state, no API), or Premium (API + SST benefits)
    2. Compute subscription: monthly_price * 12, apply 10% annual discount if applicable
    3. Compute SST-eligible filings (Premium only): states with no physical nexus that are SST members
    4. Filing cost = (total_filings - sst_free_filings) * $39 (volume discounts toward $20 at scale)
    5. Registrations modeled as $0 (TaxCloud absorbs SST state registrations; non-SST state fees passthrough)
    6. Total annual = subscription + filings + 0 (registrations)
  output_caveat: "Filings are priced as a tiered annual subscription (not per-filing × volume). The SST CSP credit eliminates the per-filing cost in all 24 SST member states, Tennessee included, where the customer has economic nexus only (no physical presence), on any TaxCloud plan."


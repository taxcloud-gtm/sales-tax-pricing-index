sst:
  is_csp: true
  sst_member_states_covered_free: 24
  eligibility_requirements: "Available on every TaxCloud plan, in all 24 SST member states, with no state excluded. TaxCloud is the Certified Service Provider, so the free-filing benefit follows the customer regardless of plan tier. The 24 states are the 23 full members plus Tennessee; Tennessee is an associate member of the SST Governing Board, and TaxCloud's SST savings apply there on the same terms as everywhere else. The customer must be enrolled in SST and have no physical nexus in the member state. The free benefit covers calculation, filing, remittance, exemption certificate processing, and remote-seller registration. Two documentation notes, neither of which changes how the benefit works: TaxCloud's help-center filing-fee article reads as though the SST discount is Premium-only (it is not, it is on every plan), and that same article lists 25 free-filing states because it adds Pennsylvania, which is not an SST member state. Both are flagged for correction in the help center; Pennsylvania is tracked separately and is not counted in the 24 here."
  filings_covered_under_csp: true
  source: "https://taxcloud.com/taxcloud-pricing/"


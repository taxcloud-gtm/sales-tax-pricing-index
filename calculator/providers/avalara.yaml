# =============================================================================
# Avalara, populated example following schema.yaml v1.0
# Last full verification: 2026-05-11
# Researcher: TaxCloud GTM (initial draft)
#
# Why Avalara is the second example:
# - Opposite end of the transparency spectrum from TaxJar, stress-tests the
#   schema's opaque-vendor handling, range types, and confidence ratings.
# - Multi-product structure (AvaTax + Returns + CertCapture + Registration +
#   License Guidance + 1099) reveals where the schema bends. See notes at
#   bottom for schema v2 recommendations.
# - #1 displacement target for TaxCloud GTM, so accuracy and citation quality
#   matter more here than for any other competitor.
#
# DATA POSTURE
# Avalara publishes pricing for only a narrow set of low-touch products
# (License Guidance, Sales Tax Registration, 1099 & W-9). The core platform
# AvaTax, Returns, CertCapture, and ERP connectors, is quote-only. Every
# price below for core products is sourced from Vendr buyer data, checkthat.ai,
# G2 / TrustRadius / Capterra reports, and Reddit invoices. These are
# confidence C–E and MUST be displayed as ranges with disclosed methodology.
# =============================================================================

provider:
  name: "Avalara"
  slug: "avalara"
  legal_name: "Avalara, Inc."
  parent_company: "Vista Equity Partners"  # Taken private by Vista in 2022; reportedly planning IPO
  hq_location: "Durham, North Carolina, USA"
  founded_year: 2004
  primary_url: "https://www.avalara.com"
  pricing_url: "https://www.avalara.com/us/en/products/pricing.html"
  help_center_url: "https://help.avalara.com"
  target_icp: "Mid-market to enterprise; broad horizontal coverage across ecommerce, manufacturing, retail, SaaS"
  primary_verticals:
    - enterprise
    - ecommerce
    - b2b
    - saas
  competitive_position: "Market incumbent (founded 2004, ~30,000 customers). Broadest integration catalog. Quote-based, sales-led GTM. Frequently criticized in reviews for opaque pricing, costly overages, and slow support."

transparency:
  tier: partial
  rationale: "Upgraded from opaque in August 2026, but only partially. Avalara now publishes per-state list pricing for its core compliance bundle ($79/state/month, or $69/state/month with SST services), corroborated across roughly a dozen Avalara pages plus G2 and TrustRadius. Three things stop it being 'transparent'. The published plans support only 15 named non-ERP integrations, so every ERP buyer is quote-only at any revenue; the $50M+ segment remains quote-only; and the plans disclose no transaction limits, included return counts, per-filing fees, overage rates, or implementation fees, while the same page's FAQ still describes volume-based pricing. There is also no self-serve checkout — every CTA is a sales contact form, and the Returns and small-business pages remain quote-only. Ancillary products (License Guidance $119, registration $403/location, 1099 & W-9) continue to carry public per-unit pricing."
  pricing_page_has_dollar_amounts: true
  quote_required_for_core_product: false  # Below $50M revenue. Above $50M it still is.
  publishes_filing_fees: false
  publishes_registration_fees: true       # $403/state is published
  publishes_overage_rates: false
  publishes_implementation_fees: false

# NOTE 2026-08: Avalara now runs two pricing motions. Under $50M revenue it is
# per-state list pricing (published). At $50M+ it is still custom_quote. The
# primary is kept as custom_quote because the enterprise motion is what defines
# the brand and what the aggregator data below describes, but the calculator
# routes sub-$50M buyers to the published per-state math.
pricing_model:
  primary: custom_quote
  scales_with:
    - transactions
    - states
    - filings
    - jurisdictions
    - seats
  predictability_score: 1
  predictability_notes: "Pricing is custom-quoted per customer based on monthly transaction volume, jurisdiction count, product mix, integration complexity, and contract length. Vendr data shows the same nominal transaction tier can produce contract values varying by 2-3x across customers. Overage charges and ERP connector fees are common sources of unbudgeted cost. Multi-year and multi-product commitments yield material discounts but lock customers in."

# -----------------------------------------------------------------------------
# Plans
#
# SCHEMA NOTE: Avalara does not have "plans" in the TaxJar sense. It has
# multiple separately purchaseable products (AvaTax, Returns, CertCapture,
# Registration, License Guidance, 1099). For v1, we model each product as a
# "plan" entry. Buyer segments (small / mid-market / enterprise) are captured
# as order_tiers within AvaTax since that's where the contract value sits.
# For v2 of the schema, recommend splitting `products` from `plans` so a
# provider can have multiple products each with multiple plans.
# -----------------------------------------------------------------------------
plans:
  # ---------------------------------------------------------------------------
  # PUBLISHED LIST PRICING, new 2026-07-30
  #
  # For the first time, Avalara publishes per-state list pricing for its core
  # calculation + returns bundle.
  #
  # DATING. Avalara's own AEM metadata gives datePublished 2026-07-30 on BOTH
  # the plan page and the main pricing hub, with the hub modified
  # 2026-07-30T14:31:28Z — a coordinated same-day rollout. The plan page was
  # modified again 2026-08-17. Wayback could not be read to prove absence
  # beforehand (403 through our tooling), so 2026-07-30 is a strong inference
  # from vendor metadata, not archival proof.
  #
  # CORROBORATION (checked 2026-08-18, four independent passes):
  # - The "$699 per state, per year" anchor appears on ~11 Avalara-owned pages,
  #   including AvaTax, the SST page, the Shopify/WooCommerce/Amazon/Stripe
  #   integration pages, and the Avalara-vs-Anrok and Avalara-vs-TaxJar pages.
  #   The main pricing hub links to the plan page in normal navigation, so this
  #   is a site-wide rollout, not an orphaned test page.
  # - G2 lists both plans at $79 and $69 per state per month, with its pricing
  #   data stamped 2026-08-07. TrustRadius carries the same two figures plus the
  #   "$50M / limited integrations" qualifier.
  # - The full four-number grid ($79/$799/$69/$699) appears on only ONE Avalara
  #   page. Everything else carries the $699 anchor alone.
  # - ZERO editorial coverage. No press release, no blog post, and no third-party
  #   article. Galvix's Avalara pricing piece, updated 2026-08-14, still
  #   describes Avalara as entirely quote-only. Treat the strategic read as
  #   provisional; the numbers themselves are solid.
  #
  # TWO GATES, and revenue is the weaker one:
  # - $50M is a plan-card LABEL, not stated exclusion language. The page says
  #   pricing "scales rather than locking into fixed tiers."
  # - The real gate is the integration list. Both Core plans are labeled
  #   "LIMITED INTEGRATIONS" and support 15 named connectors. Every ERP is
  #   Custom-plan-only, so a $5M NetSuite seller is still quote-only.
  #
  # NOT a self-serve motion. All three plan CTAs are "Get started" contact
  # forms. Avalara's Returns and small-business pages remain quote-only, and the
  # plan page's own FAQ still describes volume-based pricing. These are list
  # prices, not transactable prices.
  #
  # These two entries are confidence A. Everything below them (the AvaTax
  # buyer-segment ranges) remains aggregator-sourced and applies to the $50M+
  # segment and to every ERP buyer, both still quote-only.
  # ---------------------------------------------------------------------------
  - name: "Core Compliance"
    slug: "core-compliance"
    tagline: "Published per-state pricing for sellers under $50M in annual revenue"
    target_customer: "Businesses under $50M in annual revenue running one of the 15 supported non-ERP integrations. Bundles AvaTax, AvaTax Exemptions, Managed Returns (filing, remittance and notice management), compliance support and audit readiness, and 50-state nexus monitoring. The $50M figure is a plan-card label rather than stated exclusion language; the binding constraint is the integration list."
    is_free: false
    is_quote_only: false
    monthly_price:
      amount: 79
      type: exact
      source: "https://www.avalara.com/us/en/products/sales-and-use-tax/pricing.html"
      source_date: 2026-08-18
      confidence: A
    annual_price:
      amount: 799
      discount_pct_vs_monthly: 15
      source: "https://www.avalara.com/us/en/products/sales-and-use-tax/pricing.html"
      source_date: 2026-08-18
      confidence: A
    order_tiers: []
    overage:
      model: per_unit
      per_unit_cost: null
      description: "The plan page states no transaction limit and no included-return count. Avalara's general pricing language still says cost factors include transaction volume and integration footprint, so overage behavior at this list price is undocumented."
    included_filings_per_period:
      count: null
      period: none
    included_integrations: 15  # "LIMITED INTEGRATIONS": Amazon, BigCommerce, DualEntry, eBay, Etsy, Miva, QuickBooks Desktop, QuickBooks Online, Sage 50, Shopify, Shopify Marketplace Connect, Stripe, TikTok, Walmart, WooCommerce. No ERP.
    included_states: null   # Priced per state; the rate IS the unit, not an allotment
    api_access_included: false  # "flexible API" is listed as a Custom-plan feature
    features:
      nexus_monitoring: true
      exemption_certificate_mgmt: true
      multi_state_filing: true
      audit_support: true
      phone_support: true
      dedicated_csm: false
      sst_program_access: false
      vda_support: false
      international_vat_gst: false

  - name: "Core Compliance + SST Services"
    slug: "core-compliance-sst"
    tagline: "Published per-state pricing with state-funded SST services, cheaper than the standard plan"
    target_customer: "Businesses under $50M in annual revenue, on a supported non-ERP integration, that qualify as volunteer sellers in SST member states. A strict superset of Core Compliance: adds SST enrollment, state-sponsored registration, a single registration ID across participating states, Avalara-backed liability for calculation errors in participating SST states, and Avalara handling audit inquiries. Critically, the lower rate applies only to SST-eligible transactions in participating states; non-SST states revert to standard pricing."
    is_free: false
    is_quote_only: false
    monthly_price:
      amount: 69
      type: exact
      source: "https://www.avalara.com/us/en/products/sales-and-use-tax/pricing.html"
      source_date: 2026-08-18
      confidence: A
    annual_price:
      amount: 699
      discount_pct_vs_monthly: 15
      source: "https://www.avalara.com/us/en/products/sales-and-use-tax/pricing.html"
      source_date: 2026-08-18
      confidence: A
    order_tiers: []
    overage:
      model: per_unit
      per_unit_cost: null
      description: "Same undocumented overage posture as Core Compliance. Avalara's fine print, verbatim: 'State-funded services apply only to SST-eligible transactions in participating states and only for qualifying volunteer sellers. If you operate in non-SST states, or in SST states where you don't meet the volunteer seller criteria, standard AvaTax and Managed Returns pricing applies.'"
    included_filings_per_period:
      count: null
      period: none
    included_integrations: 15  # Same "LIMITED INTEGRATIONS" list as Core Compliance. No ERP.
    included_states: null   # Priced per state; the rate IS the unit, not an allotment
    api_access_included: false
    features:
      nexus_monitoring: true
      exemption_certificate_mgmt: true
      multi_state_filing: true
      audit_support: true
      phone_support: true
      dedicated_csm: false
      sst_program_access: true
      vda_support: false
      international_vat_gst: false

  - name: "AvaTax (core tax calculation engine)"
    slug: "avatax"
    tagline: "Core sales tax calculation across 13,000+ U.S. jurisdictions; quote-based"
    target_customer: "Any business with multi-state nexus; pricing scales with monthly transaction volume"
    is_free: false
    is_quote_only: true
    
    monthly_price:
      amount: null
      type: range
      range_min: 617          # ~$7,400/yr mid-market floor / 12 (checkthat.ai)
      range_max: 5833         # ~$70,000/yr enterprise ceiling / 12 (checkthat.ai)
      source: "https://checkthat.ai/brands/avalara/pricing"
      source_date: 2026-05-11
      confidence: C
    
    annual_price:
      amount: null
      discount_pct_vs_monthly: null
      source: "https://checkthat.ai/brands/avalara/pricing"
      source_date: 2026-05-11
      confidence: C
    
    # Buyer-segment "tiers", these are NOT Avalara's named plans (Avalara
    # has no named plans for AvaTax). They reflect typical contract ranges
    # by buyer revenue size, sourced from aggregator buyer data.
    order_tiers:
      - included_orders: 6000  # ~500/mo * 12, small business floor
        monthly_price: 617
        annual_price: 7400
        api_calls_included: null
        source: "https://checkthat.ai/brands/avalara/pricing"
        confidence: C
      - included_orders: 30000  # ~2,500/mo, typical mid-market
        monthly_price: 1500
        annual_price: 18000
        api_calls_included: null
        source: "https://www.getsphere.com/blog/how-much-does-avalara-cost"
        confidence: D
      - included_orders: 120000  # ~10,000/mo, upper mid-market / lower enterprise
        monthly_price: 3500
        annual_price: 42000
        api_calls_included: null
        source: "https://checkthat.ai/brands/avalara/pricing"
        confidence: C
      - included_orders: null    # Enterprise, fully custom
        monthly_price: null
        annual_price: null
        api_calls_included: null
        source: "https://www.vendr.com/marketplace/avalara"
        confidence: C
    
    overage:
      model: per_unit
      per_unit_cost: null         # Per-transaction overage rate not publicly disclosed
      description: "Per-transaction fees apply when monthly volume exceeds contracted tier. Rate is custom-negotiated and not publicly disclosed. Vendr buyer reports describe overage as a frequent source of unbudgeted cost, customers report being pushed into renegotiation rather than paying overage fees long-term."
    
    included_filings_per_period:
      count: 0                    # AvaTax does NOT include filings; Returns is a separate product
      period: none
    included_integrations: null   # ERP connectors charged separately
    included_states: null
    api_access_included: true     # API is core to AvaTax
    
    features:
      nexus_monitoring: true
      exemption_certificate_mgmt: false  # CertCapture is a separate product
      multi_state_filing: false          # Returns is a separate product
      audit_support: false               # Add-on
      phone_support: true                # Quality varies by tier
      dedicated_csm: true                # Enterprise-tier contracts
      sst_program_access: true           # Avalara is an SST CSP
      vda_support: true                  # Add-on service
      international_vat_gst: true        # Separate product set

  - name: "Avalara Returns (filing and remittance)"
    slug: "returns"
    tagline: "Automated sales tax return preparation, filing, and remittance"
    target_customer: "AvaTax customers with multi-state filing obligations"
    is_free: false
    is_quote_only: true
    
    monthly_price:
      amount: null
      type: range
      range_min: null             # Per-return pricing model, not subscription
      range_max: null
      source: "https://checkthat.ai/brands/avalara/pricing"
      source_date: 2026-05-11
      confidence: C
    
    annual_price:
      amount: null
      discount_pct_vs_monthly: null
      source: ""
      source_date: 2026-05-11
      confidence: G
    
    order_tiers: []               # Priced per-return, not per-order
    
    overage:
      model: per_unit
      per_unit_cost: null
      description: "Returns is typically priced per-filing with a base subscription fee. Per-filing fees publicly reported at $42-$54 per return (checkthat.ai). Combined cost depends on filing frequency and state count."
    
    included_filings_per_period:
      count: null
      period: monthly
    included_integrations: null
    included_states: null
    api_access_included: false
    
    features:
      nexus_monitoring: false
      exemption_certificate_mgmt: false
      multi_state_filing: true
      audit_support: false
      phone_support: true
      dedicated_csm: false
      sst_program_access: true
      vda_support: false
      international_vat_gst: false

  - name: "Avalara 1099 & W-9"
    slug: "1099-w9"
    tagline: "1099 and W-9 management with publicly tiered pricing"
    target_customer: "Any business with 1099 reporting obligations"
    is_free: false
    is_quote_only: false          # Notably, the ONLY Avalara product with published tier pricing
    
    monthly_price:
      amount: null
      type: range
      range_min: null
      range_max: null
      source: "https://checkthat.ai/brands/avalara/pricing"
      source_date: 2026-05-11
      confidence: C
    
    annual_price:
      amount: null
      discount_pct_vs_monthly: null
      source: ""
      source_date: 2026-05-11
      confidence: C
    
    # 1099 product has Individual / Professional / Enterprise tiers
    # publicly priced; need to capture specific dollar amounts from
    # pricing page. Currently null pending direct page snapshot.
    order_tiers: []
    
    overage:
      model: per_unit
      per_unit_cost: null
      description: "Per-1099 pricing within each tier; specifics on pricing page"
    
    included_filings_per_period:
      count: null
      period: annual
    included_integrations: null
    included_states: null
    api_access_included: false
    
    features:
      nexus_monitoring: false
      exemption_certificate_mgmt: false
      multi_state_filing: false
      audit_support: false
      phone_support: true
      dedicated_csm: false
      sst_program_access: false
      vda_support: false
      international_vat_gst: false


  has_per_registration_fee: true
  base_cost:
    amount: 403                   # Published list price
    source: "https://www.avalara.com/us/en/products/pricing.html"
    confidence: A
  includes_state_fees: false      # Customer pays state permit fees separately; verify
  notes: "$403/location is one of Avalara's only public list prices. checkthat.ai reports range of $349-$403 across deal types, suggesting negotiation possible. License Guidance product available at $119 as a precursor to registration."


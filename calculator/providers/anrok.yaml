  founded_year: 2020
  primary_url: "https://www.anrok.com"
  pricing_url: "https://www.anrok.com/pricing"
  help_center_url: null
  target_icp: "Originally SaaS-only; as of the 2026 reprice Anrok sells a separate ecommerce line at half the per-market rate. No ARR thresholds are published for any tier. Strongest fit remains digital businesses with multi-jurisdiction footprints, where the per-market unit is small and predictable."
  primary_verticals:
    - saas
    - ecommerce
  competitive_position: "SaaS-first sales tax platform that moved to flat per-market pricing in 2026, abandoning the subscription-plus-basis-points model that made it the odd one out in the category. The new structure prices almost identically to Sphere ($100 per unit per month, EU-via-OSS counted as one unit), and undercuts it at $50 for ecommerce sellers. Differentiates on SaaS taxability handling, payroll/HR integration for physical nexus tracking, and global VAT coverage."

transparency:
  tier: partial
  rationale: "Both Starter tiers publish a flat per-market rate ($100 general, $50 ecommerce). Both Custom tiers are quote-only. Anrok publishes the unit definition of a 'market' but does not publish the high-volume surcharge that can apply on Starter, and publishes no ARR or volume thresholds for when a buyer is pushed to Custom."
  pricing_page_has_dollar_amounts: true
  quote_required_for_core_product: false
  publishes_filing_fees: true
  publishes_registration_fees: true
  publishes_overage_rates: false
  publishes_implementation_fees: false

pricing_model:
  primary: per_region_flat
  scales_with:
    - jurisdictions
  predictability_score: 4
  predictability_notes: "Highly predictable at the unit level: cost = active markets x monthly rate. Two things stop it being a 5. Anrok discloses that Starter customers with high transaction volumes 'may be subject to additional fees to cover 3rd party fees we may incur' without publishing a threshold or a rate, and it publishes no volume boundary at which a buyer is moved to Custom."

# -----------------------------------------------------------------------------
# Plans
#
# Anrok sells two product lines from one pricing page, each with a Starter and
# a Custom tier. The only difference between the lines at Starter is the rate.
#
# UNIT DEFINITION, published by Anrok:
#   each US state = 1 market
#   EU filed via OSS = 1 market
#   Canada federal GST/HST = 1 market
#   BC, Manitoba, Saskatchewan and Quebec each count as their own market
# -----------------------------------------------------------------------------

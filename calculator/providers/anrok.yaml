change_log:
  - date: 2026-08-18
    change_type: structure_change
    description: "Anrok replaced subscription-plus-basis-points pricing with a flat fee per market per month. Starter is $100 per market per month for non-ecommerce companies and $50 per market per month on a new ecommerce product line. The $499/mo Starter and $999/mo Core plans no longer exist, the 40 bps and 30 bps transaction fees are gone from the pricing page entirely, the Growth tier is renamed Custom, and the published <$2M ARR guidance for Starter has been removed. Anrok now publishes a unit definition for a market (each US state, EU via OSS as one, Canada federal GST/HST as one with BC, Manitoba, Saskatchewan and Quebec separate). New disclosure: high-volume Starter sellers may be charged unquantified third-party fees. Anrok did not announce the change and its pricing page carries no last-updated date, so the exact date it took effect is unknown; it falls between our 2026-05-11 verification and 2026-08-18."
    source: "https://www.anrok.com/pricing"
  - date: 2026-05-12
    change_type: structure_change
    description: "Verified Anrok pricing against the published pricing sheet (mirrored on G2). Three corrections: Starter ICP is <$2M ARR (we had <$5M), exemption certificates are included in Starter (we had it gated to Core+), and no explicit ARR range is published for Core or Growth (we had inferred $5M-$50M and $50M+)."
    source: "https://www.g2.com/products/anrok/pricing"

calculator:
  applicable_inputs:
    - states_filing
    - integration_type
    - monthly_orders
  cost_formula_notes: |
    1. Count markets = states_filing + international_countries.
       Anrok's published unit definition treats each US state as one market and
       the EU filed via OSS as one market. We count international_countries
       one-for-one, which slightly overstates cost for EU-heavy buyers.
    2. Pick the rate by product line:
       - ecommerce integrations (Shopify, BigCommerce, WooCommerce) -> $50/market/mo
       - everything else -> $100/market/mo
       Anrok publishes no rule for which line a buyer falls into beyond
       "eCommerce companies"; integration type is our proxy and is disclosed
       as an assumption in the output.
    3. Annual total = markets x rate x 12
    4. No filing, registration, or basis-point fees are added. Anrok includes
       filings and registrations in the per-market fee.
  output_caveat: "Anrok includes filings and registrations in the flat per-market fee, so this estimate is the whole recurring bill for buyers who stay on Starter. Two costs are not modeled because Anrok does not publish them: the third-party surcharge that may apply to high-volume Starter sellers, and the Custom tier, which Anrok quotes against total transaction volume with no published threshold for when a buyer is moved onto it."

notes: |
  The August 2026 reprice makes Anrok structurally comparable to Sphere for the
  first time. Both now sell a flat monthly fee per jurisdiction unit, both count
  the EU filed via OSS as a single unit, and both list $100 as the headline
  rate. Anrok's ecommerce line at $50 undercuts Sphere by half. This is worth
  its own comparison content: two AI-native, VC-backed, SaaS-first vendors
  converging on the same pricing primitive within months of each other.

  What changed in the buyer conversation:
  - The old "hybrid pricing penalizes growth" argument is dead. Anrok's bill no
    longer scales with revenue or transaction value at the Starter tier. Any
    TaxCloud content still making that argument needs rewriting.
  - The new cost driver is jurisdiction count. Anrok gets expensive for buyers
    filing in many states and cheap for buyers filing in few, which is the
    opposite of how per-filing pricers behave.
  - At 20 states, Anrok Starter is $24,000/yr general or $12,000/yr ecommerce
    with everything included. That is a real number to compare against, and it
    is no longer obviously more expensive than a per-filing model at high
    filing counts.
  - Anrok is still not an SST CSP, so the SST free-filing comparison is
    unaffected by the reprice and is now a larger share of the total gap.

  Open research items:
  - The high-volume third-party fee: threshold and rate are both unpublished.
  - Whether the Custom tier has a published or de facto market-count trigger.
  - Whether the ecommerce line has feature differences beyond the rate.
  - Whether annual prepay pricing exists but is unpublished.

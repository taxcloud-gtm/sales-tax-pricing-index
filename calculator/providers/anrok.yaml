# Anrok, following schema.yaml v1.0
# Last full verification: 2026-08-18
# Researcher: TaxCloud GTM
#
# 2026-08-18 REPRICE
# Anrok abandoned the subscription + basis-points model. Pricing is now a flat
# fee per market per month, with a separate, cheaper product line for
# ecommerce sellers. No basis-point rate appears anywhere on the pricing page.
# Every price in the previous version of this file ($499/$999 Starter/Core,
# 40/30 bps) is obsolete. Verified twice against the live page and the FAQ.
#
# Why Anrok is worth modeling carefully:
# - Now tests the per_region_flat primitive alongside Sphere, with a nearly
#   identical unit definition (EU via OSS counts as one)
# - Two product lines at different rates ($100 general, $50 ecommerce)
# - Undisclosed high-volume surcharge on Starter is a real opacity gap
# =============================================================================

provider:
